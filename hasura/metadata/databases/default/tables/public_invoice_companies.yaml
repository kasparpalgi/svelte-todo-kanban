table:
  name: invoice_companies
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: company_id
        table:
          name: invoices
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - address
        - created_at
        - id
        - is_default
        - name
        - updated_at
        - user_id
        - vat_number
        - vat_rate
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - address
        - created_at
        - id
        - is_default
        - name
        - updated_at
        - user_id
        - vat_number
        - vat_rate
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - address
        - is_default
        - name
        - updated_at
        - vat_number
        - vat_rate
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
