table:
  name: invoices
  schema: public
object_relationships:
  - name: board
    using:
      foreign_key_constraint_on: board_id
  - name: client
    using:
      foreign_key_constraint_on: client_id
  - name: company
    using:
      foreign_key_constraint_on: company_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: items
    using:
      foreign_key_constraint_on:
        column: invoice_id
        table:
          name: invoice_items
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - board_id
        - client_id
        - company_id
        - created_at
        - currency
        - custom_fields
        - due_date
        - hourly_rate
        - id
        - invoice_number
        - issued_date
        - notes
        - status
        - total_amount
        - total_hours
        - updated_at
        - user_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - board_id
        - client_id
        - company_id
        - created_at
        - currency
        - custom_fields
        - due_date
        - hourly_rate
        - id
        - invoice_number
        - issued_date
        - notes
        - status
        - total_amount
        - total_hours
        - updated_at
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - company_id
        - currency
        - custom_fields
        - due_date
        - hourly_rate
        - invoice_number
        - issued_date
        - notes
        - status
        - total_amount
        - total_hours
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
