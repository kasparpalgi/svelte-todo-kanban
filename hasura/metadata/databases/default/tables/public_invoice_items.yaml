table:
  name: invoice_items
  schema: public
object_relationships:
  - name: invoice
    using:
      foreign_key_constraint_on: invoice_id
  - name: todo
    using:
      foreign_key_constraint_on: todo_id
insert_permissions:
  - role: user
    permission:
      check:
        invoice:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - amount
        - created_at
        - hourly_rate
        - hours
        - id
        - invoice_id
        - title
        - todo_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - amount
        - created_at
        - hourly_rate
        - hours
        - id
        - invoice_id
        - title
        - todo_id
      filter:
        invoice:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        invoice:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
