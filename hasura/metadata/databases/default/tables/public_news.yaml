table:
  name: news
  schema: public
object_relationships:
  - name: created_by_user
    using:
      foreign_key_constraint_on: created_by
array_relationships:
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: related_news_id
        table:
          name: notifications
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - title
        - body
        - url
        - created_at
        - created_by
      filter: {}
    comment: ""
