table:
  name: board_members
  schema: public
object_relationships:
  - name: board
    using:
      foreign_key_constraint_on: board_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - board:
              user_id:
                _eq: X-Hasura-User-Id
          - board:
              board_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
          - _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - board:
                  board_invitations:
                    _and:
                      - status:
                          _eq: pending
                      - role:
                          _ceq:
                            - $
                            - role
                      - _or:
                          - invitee_email:
                              _eq: X-Hasura-User-Email
                          - invitee_username:
                              _eq: X-Hasura-User-Username
      columns:
        - created_at
        - updated_at
        - board_id
        - id
        - user_id
        - role
    comment: Board owners add members; an invitee adds only themselves, with the invited role
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - updated_at
        - board_id
        - id
        - user_id
        - role
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - board:
              user_id:
                _eq: X-Hasura-User-Id
          - board:
              board_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - board:
              is_public:
                _eq: true
    comment: Members of boards the user can see
update_permissions:
  - role: user
    permission:
      columns:
        - role
        - updated_at
      filter:
        _or:
          - board:
              user_id:
                _eq: X-Hasura-User-Id
          - board:
              board_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
      check: null
    comment: Only board owners change a member's role
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - board:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
