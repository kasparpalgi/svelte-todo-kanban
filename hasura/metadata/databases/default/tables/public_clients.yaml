table:
  name: clients
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: boards
    using:
      foreign_key_constraint_on:
        column: client_id
        table:
          name: boards
          schema: public
  - name: invoices
    using:
      foreign_key_constraint_on:
        column: client_id
        table:
          name: invoices
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - address
        - company_name
        - created_at
        - currency
        - default_rate
        - email
        - id
        - name
        - notes
        - phone
        - updated_at
        - user_id
        - vat_number
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - address
        - company_name
        - created_at
        - currency
        - default_rate
        - email
        - id
        - name
        - notes
        - phone
        - updated_at
        - user_id
        - vat_number
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - address
        - company_name
        - currency
        - default_rate
        - email
        - name
        - notes
        - phone
        - updated_at
        - vat_number
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
