# No user-role permissions on purpose (#227): the browser writes and reads logs only
# through the createLog / getLogs ops (src/lib/server/ops/logs.ts, admin secret), which
# cap writes per tab and delete rows older than 30 days. A direct GraphQL insert would
# skip both, so the table filled up to 99k rows before.
table:
  name: logs
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
