table:
  name: push_subscriptions
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-User-Id
      columns:
        - endpoint
        - p256dh
        - auth
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - p256dh
        - auth
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - endpoint
        - p256dh
        - auth
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
